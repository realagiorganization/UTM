name: Apple Self-Hosted iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: [self-hosted, macOS, ARM64, utm]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Build UTM iOS app
        run: |
          xcodebuild \
            -project UTM.xcodeproj \
            -scheme iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
